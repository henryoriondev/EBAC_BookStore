[project]
name = "ebac-bookstore"
version = "0.1.0"
description = "Bookstore API"
authors = [
    {name = "henryoriondev", email = "henryorion.dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "Django>=5.2,<6.0",
    "pytest>=9.0.3,<10.0.0",
    "factory-boy>=3.3.3,<4.0.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"